<body>

<!-- Header will have the site title and navigation -->
 <header>
    <a href="index.html" class="brand">
        <img src="images/BakedBunzLogo.png" alt="Baked Bunz Logo" class="logo">
        <span class="site-title">Baked Bunz</span>
    </a>
    <nav>
         
        <ul aria-label="Main navigation">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutUs.html">About</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="enquiry.html" aria-current="page">Enquiry</a></li>
        </ul>
    </nav>
 </header>
 <!-- tenquiry from orders / questions  -->
  <main>

    <section id="enquiry-form">
        <h1>Make an Enquiry</h1>
        <p>Interested in a custom order or have a question about our products? Fill in the form below and we will tell you the price and availability straight away.</p>

    <form id="enquiryform" action="#" method="post" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required minlength="2" autocomplete="name" aria-describedby="name-error">
        <span id="name-error" class="field-error"></span>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error">
        <span id="email-error" class="field-error"></span>

        <label for="phone">Phone Number (optional)</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 078 123 4567" autocomplete="tel" aria-describedby="phone-error">
        <span id="phone-error" class="field-error"></span>

        <label for="product">Product of Interest</label>
        <select id="product" name="product" required aria-describedby="product-error">
            <option value="">-- Choose a product --</option>
        </select>
        <span id="product-error" class="field-error"></span>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" max="50" value="1" required aria-describedby="quantity-error">
        <span id="quantity-error" class="field-error"></span>

        <label for="date">Date Needed</label>
        <input type="date" id="date" name="date" required aria-describedby="date-error">
        <span id="date-error" class="field-error"></span>

        <label for="message">Extra Details (optional)</label>
        <textarea id="message" name="message" rows="4" maxlength="300" aria-describedby="message-error"></textarea>
        <span id="message-error" class="field-error"></span>

        <button type="submit" id="enquiry-submit">Submit Enquiry</button>
    </form>

    <p id="enquiry-status" class="form-status" role="status" aria-live="polite"></p>

    <div id="enquiry-response" class="response-box" role="status" aria-live="polite" hidden></div>
</section>

  </main>
  <!-- footer with copyright -->
   <footer>
    <p>&copy;2026 BakedBunz. All rights reserved.</p>
   </footer>
    <script src="./js/cart.js"></script>
</body>
</html>
